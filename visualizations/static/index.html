<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="基于 ZNBC Tokenizer 当前 Python 实现的本地可视化界面"
    >
    <title>Tokenizer 可视化实验室</title>
    <link rel="stylesheet" href="/styles/system.css">
    <link rel="stylesheet" href="/styles/bpe.css">
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <div class="brand">
          <span class="eyebrow">ZNBC Tokenizer</span>
          <h1>Tokenizer 可视化实验室</h1>
          <p>浏览器负责展示，训练与编码结果来自当前 Python 实现。</p>
        </div>
        <nav class="view-tabs" aria-label="可视化功能">
          <span class="view-tab is-active" aria-current="page">BPE 合并过程</span>
          <span class="view-tab is-placeholder">后续视图</span>
        </nav>
      </div>
    </header>

    <main class="shell page-stack">
      <section class="panel controls-panel" aria-labelledby="controls-title">
        <div class="panel-header">
          <div>
            <span class="section-index">01</span>
            <h2 id="controls-title">训练并编码</h2>
          </div>
          <span id="source-label" class="source-label">等待连接 bpe.py</span>
        </div>

        <form id="bpe-form" class="control-grid">
          <label class="field field-wide" for="corpus-input">
            <span>训练样本</span>
            <small>每行是一个独立 string，pair 不跨行统计。</small>
            <textarea id="corpus-input" rows="4">banana bandana
你好你好</textarea>
          </label>

          <label class="field" for="vocab-input">
            <span>目标词表大小</span>
            <small>包含最初的 256 个 byte token。</small>
            <input id="vocab-input" type="number" min="256" max="1024" value="264">
          </label>

          <label class="field" for="text-input">
            <span>使用训练结果编码</span>
            <small>这个 string 不参与训练。</small>
            <input id="text-input" type="text" value="banana 你好">
          </label>

          <div class="form-actions">
            <button id="run-button" class="button button-primary" type="submit">
              用 bpe.py 运行
            </button>
            <span id="request-status" class="status-line" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>

      <div id="error-message" class="alert" role="alert" hidden></div>

      <div id="results" class="page-stack" hidden>
        <section aria-labelledby="summary-title">
          <div class="section-heading">
            <span class="section-index">02</span>
            <h2 id="summary-title">训练摘要</h2>
          </div>
          <div class="metric-grid">
            <article class="metric">
              <span>实际词表</span>
              <strong id="metric-vocab">—</strong>
              <small id="metric-vocab-context">—</small>
            </article>
            <article class="metric">
              <span>学习到的 merges</span>
              <strong id="metric-merges">—</strong>
              <small>每条规则生成一个新 token</small>
            </article>
            <article class="metric">
              <span>训练 token 数</span>
              <strong id="metric-tokens">—</strong>
              <small id="metric-token-context">—</small>
            </article>
            <article class="metric">
              <span>训练压缩比</span>
              <strong id="metric-ratio">—</strong>
              <small id="metric-reduction">—</small>
            </article>
          </div>
        </section>

        <section class="panel" aria-labelledby="trace-title">
          <div class="panel-header trace-header">
            <div>
              <span class="section-index">03</span>
              <h2 id="trace-title">逐轮 merge trace</h2>
            </div>
            <div class="step-controls">
              <button id="previous-step" class="button button-quiet" type="button" disabled>上一轮</button>
              <label for="step-range" class="sr-only">选择 merge 轮次</label>
              <input id="step-range" type="range" min="1" max="1" value="1" disabled>
              <button id="next-step" class="button button-quiet" type="button" disabled>下一轮</button>
            </div>
          </div>

          <div class="step-meta">
            <strong id="step-label">—</strong>
            <span id="step-token-count">—</span>
          </div>

          <div id="merge-rule" class="merge-rule" aria-live="polite">—</div>

          <div class="sequence-grid">
            <section class="sequence-block" aria-labelledby="before-title">
              <h3 id="before-title">合并前</h3>
              <div id="before-sequences" class="sample-list"></div>
            </section>
            <section class="sequence-block" aria-labelledby="after-title">
              <h3 id="after-title">合并后</h3>
              <div id="after-sequences" class="sample-list"></div>
            </section>
          </div>

          <section class="pair-section" aria-labelledby="pairs-title">
            <div class="subsection-heading">
              <h3 id="pairs-title">本轮 pair 频率</h3>
              <span id="pair-count-note"></span>
            </div>
            <div id="pair-list" class="pair-list"></div>
          </section>
        </section>

        <section class="panel" aria-labelledby="encoding-title">
          <div class="panel-header">
            <div>
              <span class="section-index">04</span>
              <h2 id="encoding-title">新 string 的编码结果</h2>
            </div>
            <div id="encoding-summary" class="encoding-summary">—</div>
          </div>
          <div id="encoding-tokens" class="sample-list"></div>
        </section>

        <div id="invariant-checks" class="invariant-row" aria-live="polite"></div>
      </div>
    </main>

    <footer class="shell footer">
      本地只读展示层 · 默认仅监听 127.0.0.1
    </footer>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
